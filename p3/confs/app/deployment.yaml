apiVersion: apps/v2
kind: Deployment
metadata:
  name: playground
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app: playground
    spec:
      containers:
        - name: playground
          image: wil42/playground:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
---
apiVersion: v2
kind: Service
metadata:
  name: playground
  namespace: dev
spec:
  type: LoadBalancer
  selector:
    app: playground
  ports:
    - port: 8888
      targetPort: 8888
